; AgentPlatform desktop sandbox — process supervision for everything inside
; the container (SPEC.md §9.2). Installed at /etc/supervisor/supervisord.conf.

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
pidfile=/tmp/supervisord.pid
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=20MB
logfile_backups=2

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:xvfb]
; Runs as the same user as every X client (x11vnc, scrot, the desktop):
; modern X servers reject cross-uid MIT-SHM attachment, and a root X server
; is unnecessary exposure anyway.
command=/usr/bin/Xvfb :1 -screen 0 %(ENV_SCREEN_WIDTH)sx%(ENV_SCREEN_HEIGHT)sx24 -nolisten tcp -auth /home/agent/.Xauthority
user=agent
priority=10
autostart=true
autorestart=true
startretries=30
startsecs=2

[program:x11vnc]
command=/usr/local/bin/start-x11vnc.sh
priority=30
user=agent
autostart=true
autorestart=true
startretries=30
startsecs=2
stopasgroup=true
killasgroup=true

[program:novnc]
command=/usr/local/bin/start-novnc.sh
priority=40
user=agent
autostart=true
autorestart=true
startretries=30
startsecs=2
stopasgroup=true
killasgroup=true

[program:control]
command=/opt/control-venv/bin/uvicorn control.main:app --host 0.0.0.0 --port 7000 --log-level warning
directory=/opt
priority=50
user=agent
autostart=true
autorestart=true
startretries=30
startsecs=2
stopasgroup=true
killasgroup=true

[program:desktop]
command=/usr/local/bin/start-desktop.sh
priority=60
user=agent
autostart=true
autorestart=true
startretries=30
startsecs=10
stopasgroup=true
killasgroup=true
