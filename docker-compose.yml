# Local infrastructure shared by every worktree (fixed project name, so all
# Superset worktrees use the same containers; each worktree gets its own database,
# see APP_DB_NAME and `make db-up`). The default credentials are for local development
# only; never expose these ports. Real deployments set APP_PG_PASSWORD and
# APP_REDIS_PASSWORD (in .env) to strong values. POSTGRES_PASSWORD only applies when the
# data volume is first created; to change it later run ALTER USER inside psql.
# If 5432 is taken (e.g. a Homebrew Postgres), set APP_PG_PORT in .env and point
# DATABASE_URL at that port (APP_REDIS_PORT works the same way for 6379).
name: agentplatform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentplatform
      POSTGRES_PASSWORD: ${APP_PG_PASSWORD:-agentplatform}
      POSTGRES_DB: agentplatform
    ports:
      - "127.0.0.1:${APP_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentplatform -d agentplatform"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    # requirepass only when APP_REDIS_PASSWORD is set ($$ is expanded inside the container)
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes $${APP_REDIS_PASSWORD:+--requirepass "$$APP_REDIS_PASSWORD"}
    environment:
      APP_REDIS_PASSWORD: ${APP_REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:${APP_REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -n "$$APP_REDIS_PASSWORD" ]; then export REDISCLI_AUTH="$$APP_REDIS_PASSWORD"; fi;
          redis-cli ping | grep -q PONG
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: agentplatform  # local dev only
      MINIO_ROOT_PASSWORD: agentplatform-dev
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Egress filter for docker_local sandboxes (APP_SANDBOX_EGRESS=proxy; off by default).
  # Sandboxes in that mode have no default route; this proxy is the only host they can
  # reach, and it refuses any destination that resolves to a non-public address
  # (backend/src/agentplatform/egress/egress_proxy.py, docs/security.md). It publishes
  # no port; the provider attaches it to each sandbox's own internal network.
  # Start: docker compose --profile egress up -d egress-proxy
  egress-proxy:
    image: python:3.12-alpine@sha256:e064671ca452259bab50e8e2c7bd896e39e9a343bb06ca25234adf6fe18d0fc7
    profiles: ["egress"]
    command: ["python", "-I", "-B", "/proxy/egress_proxy.py"]
    environment:
      EGRESS_LISTEN: "0.0.0.0:3128"
      EGRESS_ALLOWED_PORTS: "80,443"
      # exact names that may resolve to private addresses (the eval fixture site)
      EGRESS_ALLOW_PRIVATE_HOSTS: ${APP_EGRESS_ALLOW_PRIVATE_HOSTS:-eval-fixtures}
    volumes:
      - ./backend/src/agentplatform/egress/egress_proxy.py:/proxy/egress_proxy.py:ro
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 128
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
