[project]
name = "agentplatform"
version = "0.1.0"
description = "Multi-agent computer-use platform: backend API and runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.17.0",
    "asyncpg>=0.32.0",
    "docker>=7.2.0",
    "e2b-desktop>=2.7.1",
    "fastapi>=0.156.8",
    "httpx>=0.28.1",
    "imagehash>=4.3.2",
    "jsonschema>=4.26.0",
    "openai>=3.35.1",
    "pillow>=12.3.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
agentplatform-api = "agentplatform.api.main:main"
agentplatform-runtime = "agentplatform.runtime.main:main"
agentplatform-eval = "agentplatform.evalcli:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF", "SIM", "PT", "TID"]
ignore = [
    "S101", # assert is fine in tests and invariants
    "RUF001", "RUF002", "RUF003", # spec text uses typographic dashes and arrows
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"scripts/**" = ["S"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["agentplatform"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["imagehash", "imagehash.*", "e2b_desktop", "e2b_desktop.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --import-mode=importlib -m 'not infra'"
markers = [
    "infra: needs the compose Postgres and Redis (make db-up)",
    "live: needs real models/sandboxes; skipped unless APP_LIVE=1",
    "docker: needs a local Docker daemon; skipped unless APP_DOCKER=1",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["agentplatform"]
branch = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]
